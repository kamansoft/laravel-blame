; =============================================================================
; Laravel Blame — Development PHP Configuration
; =============================================================================

memory_limit=512M
max_execution_time=120
max_input_time=120
post_max_size=64M
upload_max_filesize=64M
date.timezone=UTC
display_errors=On
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
opcache.enable_cli=1
opcache.validate_timestamps=1
